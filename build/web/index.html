<!DOCTYPE html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ruman_app" />
    <link
      rel="apple-touch-icon"
      href="icons/Icon-192.png?version=<%= new Date().getTime() %>"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="favicon.png?version=<%= new Date().getTime() %>"
    />

    <!-- إضافة meta للـ viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Shafi app</title>
    <link
      rel="manifest"
      href="manifest.json?version=<%= new Date().getTime() %>"
    />
  </head>
  <body>
    <script
      src="flutter_bootstrap.js?version=<%= new Date().getTime() %>"
      async
    ></script>
    </html>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(reg => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            window.location.reload();
          }
        });
      }
    </script>
    
  </body>
</html>
